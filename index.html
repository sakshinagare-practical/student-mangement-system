<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final module test</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
</head>
<body>


    <div class="container">
        <header>
            <div>
                <h1>Study Planner</h1>
                <p>Create and track study topics with duration, target deadline, notes, and completion status.</p>
            </div>
        </header>

        <div class="input-container">
            <input type="text" placeholder="Study Topic" id="topic">
            <input type="text" placeholder="Duration (e.g. 2 hrs)" id="duration">
            <input type="date" placeholder="Target Date" id="targetDate">
            <textarea placeholder="Notes for this topic" id="notes"></textarea>
        </div>

        <div class="controls">
            <input class="search" type="text" id="search" onkeyup="search()" placeholder="Search by topic, notes, or status">
            <button class="button" type="submit" id="submit" onclick="addTask()">Add Topic</button>
        </div>

        <div class="table-wrapper">
            <table class="table" id="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Topic</th>
                        <th>Duration</th>
                        <th>Target Date</th>
                        <th>Notes</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
